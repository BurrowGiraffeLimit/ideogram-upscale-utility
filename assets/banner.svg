<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#131a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#60a5fa;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#glow1)"/>
  <rect width="1200" height="360" fill="url(#glow2)"/>

  <!-- Decorative grid lines -->
  <line x1="0" y1="80" x2="1200" y2="80" stroke="#1a2333" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="160" x2="1200" y2="160" stroke="#1a2333" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="240" x2="1200" y2="240" stroke="#1a2333" stroke-width="0.5" opacity="0.15"/>
  <line x1="0" y1="320" x2="1200" y2="320" stroke="#1a2333" stroke-width="0.5" opacity="0.3"/>

  <!-- Decorative vertical lines -->
  <line x1="200" y1="0" x2="200" y2="360" stroke="#1a2333" stroke-width="0.5" opacity="0.1"/>
  <line x1="600" y1="0" x2="600" y2="360" stroke="#1a2333" stroke-width="0.5" opacity="0.1"/>
  <line x1="1000" y1="0" x2="1000" y2="360" stroke="#1a2333" stroke-width="0.5" opacity="0.1"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="60" r="80" fill="none" stroke="#3b82f6" stroke-width="0.5" opacity="0.06"/>
  <circle cx="1100" cy="300" r="100" fill="none" stroke="#a855f7" stroke-width="0.5" opacity="0.06"/>
  <circle cx="80" cy="300" r="40" fill="none" stroke="#60a5fa" stroke-width="0.5" opacity="0.05"/>
  <circle cx="1120" cy="50" r="55" fill="none" stroke="#8b5cf6" stroke-width="0.5" opacity="0.05"/>

  <!-- Small decorative dots -->
  <circle cx="150" cy="130" r="2" fill="#3b82f6" opacity="0.15"/>
  <circle cx="1050" cy="220" r="2" fill="#a855f7" opacity="0.15"/>
  <circle cx="320" cy="290" r="1.5" fill="#60a5fa" opacity="0.1"/>
  <circle cx="880" cy="90" r="1.5" fill="#8b5cf6" opacity="0.1"/>
  <circle cx="500" cy="50" r="1" fill="#3b82f6" opacity="0.12"/>
  <circle cx="700" cy="310" r="1" fill="#a855f7" opacity="0.12"/>

  <!-- Decorative path (wireframe style) -->
  <polyline points="130,180 170,140 210,160 260,120 310,150" fill="none" stroke="#3b82f6" stroke-width="0.5" opacity="0.08"/>
  <polyline points="890,210 940,170 990,190 1040,150 1090,180" fill="none" stroke="#a855f7" stroke-width="0.5" opacity="0.08"/>

  <!-- Bottom accent line -->
  <line x1="300" y1="340" x2="900" y2="340" stroke="url(#lineGrad)" stroke-width="1" opacity="0.4"/>

  <!-- Content -->
  <g text-anchor="middle">
    <!-- Headline -->
    <text x="600" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="56.0" font-weight="700" fill="#ffffff">
      <tspan x="600" dy="0">Ideogram 3.5 Full Resolution</tspan>
      <tspan x="600" dy="64">Hack</tspan>
    </text>

    <!-- Tagline -->
    <text x="600" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="21.0" font-weight="400" fill="#c9d1d9">
      <tspan x="600" dy="0">Ideogram 3.5 workflow companion for designers —</tspan>
      <tspan x="600" dy="30">export full-resolution images without quality loss.</tspan>
    </text>
  </g>
</svg>